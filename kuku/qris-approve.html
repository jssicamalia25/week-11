<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRIS Approve Simulator — Nails Studio</title>
  <style>
    :root {
      --bg: #fff9fa;
      --surface: #ffffff;
      --text: #2d2325;
      --muted: #78696c;
      --primary: #c9647a;
      --primary-light: #fae6ea;
      --border: #f0dce0;
      --green: #2f7d4c;
      --green-hover: #25653d;
      --green-bg: #ebf7ef;
      --red: #b5453a;
      --red-bg: #fbeeed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px 48px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--primary-light);
      gap: 12px;
    }

    .head h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .head p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .live-pill {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green);
      background-color: var(--green-bg);
      border: 1px solid #b6dfc4;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--green);
      animation: blink 1.4s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary);
      margin: 20px 0 10px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-card {
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .tx-card.highlight {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .tx-id {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .tx-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .tx-amount {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--primary);
      margin-top: 4px;
    }

    .tx-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-approve {
      background-color: var(--green);
      color: #ffffff;
    }

    .btn-approve:hover {
      background-color: var(--green-hover);
    }

    .btn-reject {
      background-color: transparent;
      border-color: #e8c0bc;
      color: var(--red);
    }

    .btn-reject:hover {
      background-color: var(--red-bg);
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .tag-paid {
      background-color: var(--green-bg);
      color: var(--green);
      border: 1px solid #b6dfc4;
    }

    .tag-rejected {
      background-color: var(--red-bg);
      color: var(--red);
      border: 1px solid #e8c0bc;
    }

    .empty {
      background-color: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .log {
      margin-top: 20px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div>
        <h1>QRIS Payment Simulator</h1>
        <p>Approve atau tolak transaksi QRIS Nails Studio secara realtime</p>
      </div>
      <span class="live-pill"><span class="dot"></span> LIVE SYNC</span>
    </header>

    <div id="sim-root"></div>
    <div id="sim-log" class="log"></div>
  </div>

  <script src="qris-approve.js"></script>
</body>
</html>
